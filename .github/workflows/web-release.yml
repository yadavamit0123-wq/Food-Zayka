name: Flutter web zip

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Zip web build
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/Food-Zayka-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: food-zayka-web
          path: Food-Zayka-web.zip
